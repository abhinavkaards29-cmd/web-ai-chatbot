<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

#chat {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
}

.msg {
  max-width: 80%;
  padding: 10px 14px;
  margin-bottom: 8px;
  border-radius: 16px;
  font-size: 15px;
}

.user {
  background: #007aff;
  color: white;
  margin-left: auto;
}

.bot {
  background: #f1f1f1;
  color: black;
  margin-right: auto;
}

#inputBar {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ddd;
}

textarea {
  flex: 1;
  height: 40px;
  resize: none;
  border-radius: 18px;
  padding: 10px;
  border: 1px solid #ccc;
}

button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: #007aff;
  color: white;
  font-size: 18px;
  margin-left: 8px;
}
</style>
</head>

<body>

<header>ChatGPT-like AI</header>

<div id="chat"></div>

<div id="inputBar">
  <textarea id="input" placeholder="Ask anything..."></textarea>
  <button onclick="send()">➤</button>
</div>

<script>
let history = [];

async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = input.value.trim();
  if (!text) return;

  const userDiv = document.createElement("div");
  userDiv.className = "msg user";
  userDiv.textContent = text;
  chat.appendChild(userDiv);

  input.value = "";

  const botDiv = document.createElement("div");
  botDiv.className = "msg bot";
  chat.appendChild(botDiv);

  const res = await fetch("http://localhost:8000/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, history })
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let botText = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    botText += decoder.decode(value);
    botDiv.textContent = botText;
    chat.scrollTop = chat.scrollHeight;
  }

  history.push({ user: text, bot: botText });
}
</script>

</body>
</html>
