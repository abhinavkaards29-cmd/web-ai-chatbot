<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Web AI Chatbot</title>
<style>
body { background:#0f0f0f; color:#e5e5e5; font-family:system-ui }
#box { max-width:800px; margin:40px auto }
.msg { padding:12px; margin:8px 0; border-radius:8px }
.user { background:#1f2937 }
.bot { background:#111827 }
textarea { width:100%; height:60px; padding:10px; background:#020617; color:white }
button { width:100%; padding:10px; margin-top:10px; background:#2563eb; color:white }
</style>
</head>
<body>

<div id="box">
  <div id="chat"></div>
  <textarea id="input" placeholder="Ask anything..."></textarea>
  <button onclick="send()">Send</button>
</div>

<script>
let history = [];

async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const msg = input.value.trim();
  if (!msg) return;

  chat.innerHTML += `<div class="msg user">${msg}</div>`;
  input.value = "";

  const botDiv = document.createElement("div");
  botDiv.className = "msg bot";
  chat.appendChild(botDiv);

  const res = await fetch("http://localhost:8000/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg, history})
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let text = "";

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    text += decoder.decode(value);
    botDiv.textContent = text;
  }

  history.push({user:msg, bot:text});
}
</script>

</body>
</html>
