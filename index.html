<!DOCTYPE html>
<html>
<head>
  <title>Velora AI</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: #1e293b;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user {
      background: #2563eb;
      align-self: flex-end;
    }

    .bot {
      background: #334155;
      align-self: flex-start;
    }

    #inputArea {
      display: flex;
      padding: 15px;
      background: #1e293b;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

<header>🚀 Velora AI</header>

<div id="chat"></div>

<div id="inputArea">
  <input type="text" id="messageInput" placeholder="Ask Velora something..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const message = input.value.trim();

    if (!message) return;

    // Show user message
    const userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.textContent = message;
    chat.appendChild(userDiv);

    input.value = "";

    // Send to backend
    const response = await fetch("http://localhost:3000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    // Show bot message
    const botDiv = document.createElement("div");
    botDiv.className = "message bot";
    botDiv.textContent = data.reply || "Error occurred.";
    chat.appendChild(botDiv);

    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
